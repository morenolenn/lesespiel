<style>
  :root{
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
    --bg1:#bfe6ff; --bg2:#9fd98a; --panel:#ffffff; --ink:#24324a; --accent:#d35400; --accent-ink:#ffffff;
    --btn:#2d6a4f; --btn-ink:#ffffff; --btn-soft:#e3f1e8; --btn-soft-ink:#1d3b2c;
    --good:#3bb273; --soft:#ffffffcc; --shadow:0 8px 0 rgba(0,0,0,.12);
    --dot:#ffffff88;
  }
  .theme-einhorn{
    --bg1:#ffd6ec; --bg2:#d9c2ff; --panel:#ffffff; --ink:#4a2c5e; --accent:#b0307e; --accent-ink:#ffffff;
    --btn:#6f35b8; --btn-ink:#ffffff; --btn-soft:#f1e7fb; --btn-soft-ink:#3f2160;
    --good:#a66bff; --soft:#ffffffb3; --dot:#ffffffaa;
  }
  .theme-einhorn .title, .theme-einhorn #endStars, .theme-einhorn #endRecord{text-shadow:0 4px 0 #c46fd6;}
  .theme-einhorn .card.yes{box-shadow:0 0 0 10px #ffd84d, 0 0 30px #ff9de0, var(--shadow);}
  .theme-weltraum{
    --bg1:#14193a; --bg2:#3a2a6b; --panel:#fdfbff; --ink:#24324a; --accent:#ffcc33; --accent-ink:#1b1f3a;
    --btn:#2c3a8f; --btn-ink:#ffffff; --btn-soft:#e7eafb; --btn-soft-ink:#1c2559;
    --good:#45d08a; --soft:#ffffff22; --dot:#ffffff44;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--bg1);}
  body{
    font-family: "Avenir Next","Avenir","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--bg1) 0%, var(--bg1) 55%, var(--bg2) 100%);
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  button{font:inherit; color:inherit; border:0; cursor:pointer; touch-action:manipulation;}
  .screen{position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);}
  .screen.on{display:flex;}

  /* deco */
  #deco{position:fixed; inset:0; pointer-events:none; overflow:hidden;}
  #deco span{position:absolute; font-size:7vmin; opacity:.55; animation:float 9s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}

  /* home */
  .title{font-size:clamp(40px,8vmin,84px); font-weight:800; margin:0 0 8px; text-align:center; color:#fff; text-shadow:0 4px 0 rgba(0,0,0,.18);}
  .mascot{font-size:clamp(90px,22vmin,220px); line-height:1; animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .bigbtn{background:var(--accent); color:var(--accent-ink); font-size:clamp(34px,6vmin,60px); font-weight:800; padding:.45em 1.4em; border-radius:999px; box-shadow:var(--shadow); margin-top:4vmin;}
  .bigbtn:active{transform:translateY(4px); box-shadow:0 4px 0 rgba(0,0,0,.12);}
  .info{margin-top:3vmin; background:var(--soft); color:var(--ink); padding:.5em 1.1em; border-radius:20px; font-size:clamp(20px,3.4vmin,32px); font-weight:700;}
  .theme-weltraum .info{color:#fff;}

  /* avatar */
  .avatarwrap{position:relative; display:inline-block;}
  .avatar{width:clamp(150px,30vmin,280px); height:clamp(150px,30vmin,280px); border-radius:50%; object-fit:cover; border:8px solid #fff; box-shadow:var(--shadow); display:block; animation:bob 2.4s ease-in-out infinite;}
  #camBtn{position:absolute; right:-6px; bottom:-6px; width:58px; height:58px; border-radius:50%; background:#fff; font-size:28px; box-shadow:0 4px 0 rgba(0,0,0,.12);}
  /* gear (parents) */
  #gear{position:fixed; top:calc(var(--sat) + 28px); right:calc(var(--sar) + 20px); width:64px; height:64px; border-radius:50%; background:var(--soft); font-size:30px; display:flex; align-items:center; justify-content:center; z-index:5;}
  #gear svg{position:absolute; inset:0; transform:rotate(-90deg);}
  #gear circle{fill:none; stroke:var(--accent); stroke-width:5; stroke-dasharray:189; stroke-dashoffset:189;}
  #gear.hold circle{transition:stroke-dashoffset 1.2s linear; stroke-dashoffset:0;}

  /* game */
  #topbar{position:absolute; top:calc(var(--sat) + 24px); left:calc(var(--sal) + 16px); right:calc(var(--sar) + 16px); display:flex; align-items:center; gap:12px;}
  .iconbtn{width:64px; height:64px; border-radius:50%; background:var(--soft); font-size:30px; flex:none;}
  #dots{flex:1; display:flex; justify-content:center; gap:8px; flex-wrap:wrap;}
  #dots i{width:22px; height:22px; border-radius:50%; background:var(--dot); display:block; transition:all .3s;}
  #dots i.done{background:var(--good);}
  #dots i.star{background:none; width:auto; height:22px; font-style:normal; font-size:22px; line-height:22px;}
  #dots i.now{box-shadow:0 0 0 4px #fff;}
  #starcount{background:var(--soft); border-radius:999px; padding:6px 16px; font-size:30px; font-weight:800; flex:none; min-width:110px; text-align:center;}
  .theme-weltraum #starcount{color:#fff;}

  #stage{width:min(92vw,1060px); display:flex; flex-direction:column; align-items:center; gap:3vmin;}
  #wordbox{position:relative; background:var(--panel); border-radius:36px; box-shadow:var(--shadow); width:100%; min-height:clamp(150px,26vmin,260px); display:flex; align-items:center; justify-content:center; padding:20px 90px;}
  #word{font-size:clamp(64px,14vmin,150px); font-weight:700; letter-spacing:.03em; color:var(--ink);}
  #word.hint{font-size:clamp(48px,9vmin,100px);}
  #word.sentence{font-size:clamp(34px,6.2vmin,70px); letter-spacing:.01em; line-height:1.25; text-align:center;}
  .card.scene{font-size:clamp(46px,9.5vmin,96px); gap:.08em;}
  #ready{font-size:clamp(50px,10vmin,100px); animation:pulse .5s ease-in-out infinite alternate;}
  @keyframes pulse{from{transform:scale(.8);opacity:.5}to{transform:scale(1.05);opacity:1}}
  #hear{position:absolute; right:14px; bottom:14px; width:68px; height:68px; border-radius:50%; background:#eef3ff; font-size:32px; display:none;}
  #hear.on{display:block;}

  #game{padding-top:calc(var(--sat) + 100px);}
  /* 2x2 grid: square, so its height = width → limit by available height */
  #grid{display:grid; grid-template-columns:repeat(2,1fr); gap:3vmin; width:min(100%, calc(100vh - 100px - var(--sat) - var(--sab) - clamp(150px,26vmin,260px) - 12vmin - 32px)); width:min(100%, calc(100dvh - 100px - var(--sat) - var(--sab) - clamp(150px,26vmin,260px) - 12vmin - 32px));}
  @media (min-aspect-ratio: 4/3){ #grid{grid-template-columns:repeat(4,1fr); width:100%;} }
  .card{background:var(--panel); border-radius:32px; box-shadow:var(--shadow); aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:clamp(70px,16vmin,150px); transition:transform .15s, opacity .4s; overflow:hidden;}
  .card img{width:85%; height:85%; object-fit:cover; border-radius:22px;}
  .card:active{transform:scale(.96);}
  .card.yes{box-shadow:0 0 0 10px var(--good), var(--shadow); transform:scale(1.06);}
  .card.nope{animation:wobble .5s; opacity:.25; pointer-events:none;}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
  .card.pop{animation:popin .25s ease-out both;}
  @keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

  /* ---- home: dois modos ---- */
  .modes{display:flex; gap:3vmin; margin-top:4vmin; flex-wrap:wrap; justify-content:center;}
  .modes .bigbtn{margin-top:0; font-size:clamp(30px,5vmin,52px); padding:.45em 1.1em;}
  .bigbtn.alt{background:var(--btn); color:var(--btn-ink);}
  /* ---- rechnen ---- */
  #mstage{display:none; width:min(94vw,1120px); height:calc(100dvh - 100px - var(--sat) - var(--sab) - 32px); gap:2.5vmin; grid-template-rows:1fr auto;}
  #game.math #stage{display:none;} #game.math #mstage{display:grid;}
  @media (min-aspect-ratio: 1/1){ #mstage{grid-template-columns:1.55fr 1fr; grid-template-rows:1fr;} }
  #mtask{position:relative; background:var(--panel); border-radius:32px; box-shadow:var(--shadow); padding:22px 26px; overflow:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; color:var(--ink);}
  #mtask::-webkit-scrollbar{display:none;}
  #mtop{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  #mtitle{font-size:clamp(20px,2.8vmin,28px); font-weight:800; color:var(--btn); margin:0; padding-top:8px;}
  #mtools{display:flex; gap:8px; margin-left:auto;}
  #mtools button{min-height:48px; padding:8px 14px; border-radius:14px; font-size:17px; font-weight:700; background:var(--btn-soft); color:var(--btn-soft-ink);}
  #markBtn.on{background:#fff1c2; color:#6b4e00;}
  #skipBtn.confirm{background:var(--btn); color:var(--btn-ink);}
  #dots i.skip{background:none; width:auto; height:22px; font-style:normal; font-size:18px; line-height:22px; opacity:.85;}
  .banner{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:8; pointer-events:none;}
  .banner div{background:var(--panel); color:var(--ink); padding:28px 36px; border-radius:28px; box-shadow:var(--shadow); font-size:clamp(28px,5vmin,48px); font-weight:800; text-align:center; animation:popin .3s ease-out;}
  .snap{border:1px solid #e3e5ea; border-radius:16px; padding:12px 14px; margin:10px 0; background:#fff;}
  .snap .eq, .snap .eq.sub{font-size:24px; margin:6px 0;} .snap .wtext, .snap .wtext.story{font-size:18px; margin:4px 0;} .snap .shop{grid-template-columns:repeat(6,1fr); gap:4px;} .snap .ware span{font-size:22px;} .snap .ware b{font-size:11px;} .snap .ware em{font-size:13px;}
  .snap .brick{width:56px; height:42px; font-size:20px;} .snap .tri{width:220px;} .snap .tin,.snap .tout{font-size:18px;} .snap .blank{border-width:2px;}
  .snap .meta{display:flex; justify-content:space-between; gap:8px; align-items:center; color:#6b7280; font-size:14px; margin-bottom:4px;}
  .snap .meta button{background:#f4f5f7; padding:6px 10px; border-radius:10px; font-size:14px;}
  .snap .ansline{font-weight:700; color:#14532d; margin-top:4px;}
  .wtext{font-size:clamp(28px,4.6vmin,46px); line-height:1.4; margin:4px 0 14px; font-weight:600;}
  .wtext.story{font-size:clamp(20px,2.9vmin,28px); font-weight:500;}
  .eq{font-size:clamp(40px,7vmin,76px); font-weight:800; letter-spacing:.02em; margin:10px 0; display:flex; flex-wrap:wrap; align-items:center; gap:.25em;}
  .eq.sub{font-size:clamp(28px,4.6vmin,50px);}
  .tag{color:var(--btn); font-size:.7em; margin-right:.2em;}
  .blank{display:inline-flex; align-items:center; justify-content:center; min-width:1.7em; height:1.25em; padding:0 .15em; border:4px dashed var(--btn); border-radius:14px; background:#fff; color:var(--ink); cursor:pointer; vertical-align:middle;}
  .blank.active{border-style:solid; background:var(--btn-soft); box-shadow:0 0 0 5px color-mix(in srgb, var(--btn) 25%, transparent);}
  .blank.ok{border:4px solid var(--good); background:#e3f7ea; color:#14532d; cursor:default;}
  .blank.ghost:empty::before{content:attr(data-ghost); opacity:.28;}
  .blank.shake{animation:wobble .45s;}
  .opslot{display:inline-flex; align-items:center; justify-content:center; width:1.2em; height:1.2em; border:4px dashed #9aa3b5; border-radius:12px; color:#9aa3b5;}
  .opslot.set{border-color:var(--good); color:var(--ink); border-style:solid;}
  .mstep{margin-top:6px;}
  .mchoice{display:flex; gap:14px; margin:10px 0 6px; flex-wrap:wrap;}

  .mchoice.answers{flex-direction:column;}

  .mchoice button.nope{opacity:.3; pointer-events:none; animation:wobble .45s;}

<script>
(() => {
'use strict';

/* ---------- data ---------- */
const APP_VERSION = 14;   // suba este número a cada publicação (e em version.json)
const DATA = JSON.parse(document.getElementById('words').textContent);
const WORDS = DATA.words;
const SENTENCES = (() => { try { return JSON.parse(document.getElementById('sentences').textContent).sentences; } catch (e) { return []; } })();
const BYID = Object.fromEntries(WORDS.map(w => [w.id, w]));

// display time per level (ms). Level 1 = muito fácil.
const LEVEL_MS = [3000, 2400, 1800, 1300, 950, 700];
const MIN_MS = 500;
const MAX_LEVEL = LEVEL_MS.length;

const THEMES = {
  wiese:    { name: 'Wiese / Tiere', mascot: '🦊', deco: ['🌼','🦋','🐞','🌷','🐝'], cls: 'theme-wiese' },
  einhorn:  { name: 'Einhorn',       mascot: '🦄', deco: ['🌈','✨','💖','☁️','🌸','🦋','💜'], cls: 'theme-einhorn' },
  weltraum: { name: 'Weltraum',      mascot: '🚀', deco: ['⭐','🪐','🌟','☄️','🌙'], cls: 'theme-weltraum' },
};

const UI = {
  de: { read: '📖 Lesen', math: '🔢 Rechnen', recs: 'Rekord:', start: 'Los! ▶', again: 'Nochmal ▶', done: 'Geschafft!', record: 'Neuer Rekord! 🏆',
        best: n => `Dein Rekord: ⭐ ${n}`, total: n => `Sternensammlung: ⭐ ${n}`,
        cheers: ['Super!', 'Toll!', 'Prima!', 'Klasse!', 'Juhu!', 'Wow!'], title: 'Laras Lesespiel',
        you: n => `⭐ ${n} Sterne!` },
  pt: { read: '📖 Ler', math: '🔢 Contas', recs: 'Recorde:', start: 'Vamos! ▶', again: 'De novo ▶', done: 'Conseguiu!', record: 'Novo recorde! 🏆',
        best: n => `Seu recorde: ⭐ ${n}`, total: n => `Coleção de estrelas: ⭐ ${n}`,
        cheers: ['Muito bem!', 'Isso!', 'Show!', 'Demais!', 'Uhuu!', 'Uau!'], title: 'Jogo de Leitura da Lara',
        you: n => `⭐ ${n} estrelas!` },
};

/* ---------- storage ---------- */
const KEY = 'laras-lesespiel-v1';
const DEFAULTS = {
  settings: { lang: 'de', theme: 'wiese', startLevel: 1, rounds: 10, maxMin: 5, sound: true, rate: 0.85, content: 'mix', mathStart: 1, mathTypes: {}, voice: {}, rec: { de: 'tanja', pt: 'francisca' } },
  totalStars: 0,
  record: { de: 0, pt: 0, math: 0 },
  marked: [],
  skipLog: [],
  mathLevel: null,
  level: { de: null, pt: null },
  ms: { de: null, pt: null },
  stats: { de: {}, pt: {}, math: {} },
  sessions: [],
};
const clone = o => JSON.parse(JSON.stringify(o));
function merge(base, extra) {
  const out = clone(base);
  if (!extra || typeof extra !== 'object') return out;
  for (const k of Object.keys(extra)) {
    if (out[k] && typeof out[k] === 'object' && !Array.isArray(out[k]) && extra[k] && typeof extra[k] === 'object' && !Array.isArray(extra[k]))
      out[k] = merge(out[k], extra[k]);
    else out[k] = extra[k];
  }
  return out;
}
function load() { try { return merge(DEFAULTS, JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { return clone(DEFAULTS); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* private mode etc. */ } }
let P = load();

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const lang = () => P.settings.lang;
const t = () => UI[lang()];
const label = w => w[lang()] || w.de;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let timers = [];
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); $('gear').style.display = id === 'home' ? 'flex' : 'none'; }
function stat(id) { const s = P.stats[lang()]; return s[id] || (s[id] = { s: 0, c: 0, m: 0 }); }

/* ---------- sound ---------- */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, start, dur, type = 'sine', vol = .18) {
  if (!P.settings.sound) return; const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(); const t0 = ac.currentTime + start;
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + .05);
}
const sfx = {
  yes()  { tone(660, 0, .15); tone(880, .1, .25); },
  star() { tone(1320, 0, .12, 'triangle', .12); tone(1760, .08, .2, 'triangle', .12); },
  soft() { tone(330, 0, .18, 'sine', .1); },
  end()  { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .13, .3, 'triangle', .15)); },
};

/* ---------- speech ---------- */
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); const vl = document.getElementById('voiceList'); if (vl) vl.innerHTML = voiceButtons(); }; }
// Apple traz vozes "de brincadeira" (Eddy, Grandpa, Rocko, Zarvox...) que soam robóticas.
// Evitamos essas e preferimos as vozes naturais (Premium/Enhanced) ou as clássicas boas.
const NOVELTY = /eddy|flo|grandma|grandpa|oma|opa|reed|rocko|sandy|shelley|albert|bad news|good news|bahh|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph|ellen/i;
const GOOD = { de: /anna|petra|helena|marlene|markus|yannick|viktor|katja|conrad|amala|vicki/i, pt: /luciana|felipe|fernanda|joana|catarina/i };
function voiceScore(v, code) {
  let sc = 0;
  if (v.lang === code) sc += 4; else if (v.lang && v.lang.replace('_', '-').startsWith(code.slice(0, 2))) sc += 2; else return -1;
  if (NOVELTY.test(v.name)) return 0;
  if (/premium/i.test(v.name) || /premium/i.test(v.voiceURI || '')) sc += 6;
  if (/enhanced|erweitert|aprimorad|melhorad/i.test(v.name) || /enhanced/i.test(v.voiceURI || '')) sc += 4;
  if (GOOD[code.slice(0, 2)] && GOOD[code.slice(0, 2)].test(v.name)) sc += 3;
  if (v.localService) sc += 1;
  return sc;
}
function voicesFor(code) {
  return voices.map(v => ({ v, sc: voiceScore(v, code) })).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).map(x => x.v);
}
function pickVoice(code) {
  const chosen = P.settings.voice && P.settings.voice[code.slice(0, 2)];
  const all = voices.filter(v => v.lang && v.lang.replace('_', '-').startsWith(code.slice(0, 2)));
  return (chosen && all.find(v => v.voiceURI === chosen)) || voicesFor(code)[0] || all[0] || null;
}
// ---- vozes gravadas (neurais), arquivos em audio/<voz>/<id>.mp3 ----
const RECORDED = {
  de: [['tanja', 'Tanja'], ['ingrid', 'Ingrid (Österreich)'], ['christoph', 'Christoph']],
  pt: [['francisca', 'Francisca']],
};
const clipCache = new Map();
function recKey() { const k = P.settings.rec && P.settings.rec[lang()]; return RECORDED[lang()].some(r => r[0] === k) ? k : RECORDED[lang()][0][0]; }
async function loadClip(key, file) {
  const url = `audio/${key}/${file}.mp3`;
  if (!clipCache.has(url)) clipCache.set(url, fetch(url).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(buf => new Promise((ok, no) => audio().decodeAudioData(buf, ok, no))).catch(() => { clipCache.delete(url); return null; }));
  return clipCache.get(url);
}
let currentClip = null;
async function playClip(key, file) {
  const ac = audio(); if (!ac) return false;
  const buf = await loadClip(key, file); if (!buf) return false;
  try { if (currentClip) currentClip.stop(); } catch (e) {}
  const src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(); currentClip = src;
  return true;
}
function speakWord(w) {
  const key = recKey();
  if (!key) return speak(label(w));
  try { speechSynthesis.cancel(); } catch (e) {}
  playClip(key, w.id).then(ok => { if (!ok) speak(label(w)); });
}
function speakHello() {
  const key = recKey(); const txt = lang() === 'de' ? 'Hallo Lara! Super gemacht!' : 'Oi Lara! Muito bem!';
  if (!key) return speak(txt);
  playClip(key, '_hallo').then(ok => { if (!ok) speak(txt); });
}
// baixa os áudios da voz escolhida em segundo plano (ficam guardados para o modo offline)
let prefetched = '';
function prefetchVoice() {
  const key = recKey(); if (!key || !location.protocol.startsWith('http') || prefetched === key) return;
  prefetched = key; const files = ['_hallo', ...WORDS.map(w => w.id), ...SENTENCES.map(t => t.id)]; let i = 0;
  const next = () => { if (i >= files.length) return; const f = files[i++]; fetch(`audio/${key}/${f}.mp3`).catch(() => {}).finally(next); };
  for (let k = 0; k < 4; k++) next();
}
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const code = lang() === 'de' ? 'de-DE' : 'pt-BR';
    u.lang = code; u.rate = P.settings.rate;
    const v = pickVoice(code);
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- avatar (foto da Lara) ---------- */
const AVATAR_KEY = 'laras-lesespiel-avatar';
function getAvatar() { try { return localStorage.getItem(AVATAR_KEY); } catch (e) { return null; } }
function renderAvatar(el, mascot) {
  const a = getAvatar();
  el.className = a ? '' : 'mascot';
  el.innerHTML = a ? `<img class="avatar" src="${a}" alt="">` : mascot;
}
function pickPhoto() { $('photoInput').value = ''; $('photoInput').click(); }
$('photoInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = () => {
    const S = 360, c = document.createElement('canvas'); c.width = c.height = S;
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
    URL.revokeObjectURL(url);
    try { localStorage.setItem(AVATAR_KEY, c.toDataURL('image/jpeg', 0.85)); } catch (err) { alert('Não consegui salvar a foto neste aparelho.'); }
    applyTheme(); if ($('parents').classList.contains('on')) openParents();
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('Não consegui abrir essa foto.'); };
  img.src = url;
});

/* ---------- theme / home ---------- */
function applyTheme() {
  const th = THEMES[P.settings.theme] || THEMES.wiese;
  document.body.className = th.cls;
  renderAvatar($('homeMascot'), th.mascot); renderAvatar($('endMascot'), th.mascot);
  const deco = $('deco'); deco.innerHTML = '';
  const spots = [[6, 12], [86, 18], [10, 70], [88, 66], [48, 88], [24, 40], [72, 42]];
  spots.forEach((p, i) => { const s = document.createElement('span'); s.textContent = th.deco[i % th.deco.length]; s.style.left = p[0] + '%'; s.style.top = p[1] + '%'; s.style.animationDelay = (i * -1.3) + 's'; deco.appendChild(s); });
}
function renderHome() {
  applyTheme();
  $('homeTitle').textContent = t().title;
  $('startBtn').textContent = t().read; $('mathBtn').textContent = t().math;
  $('againBtn').textContent = t().again;
  $('homeInfo').innerHTML = `${t().total(P.totalStars)} &nbsp;·&nbsp; ${t().recs} 📖 ${P.record[lang()] || 0} &nbsp;🔢 ${P.record.math || 0}`;
  show('home');
}

/* ---------- game state ---------- */
let G = null;

function startSession(mode, opts) {
  mode = mode === 'math' ? 'math' : 'read';
  opts = opts || {};
  audio();
  try { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); } catch (e) {}
  const savedLvl = P.level[lang()];
  const level = savedLvl ? Math.max(1, savedLvl - 1) : P.settings.startLevel;   // começa um nível abaixo (aquecimento)
  G = {
    level, ms: LEVEL_MS[level - 1], okStreak: 0, errStreak: 0,
    round: 0, stars: 0, t0: Date.now(), recent: [], results: [],
    target: null, options: [], attempt: 0, locked: true, startLevel: level, startMs: LEVEL_MS[level - 1],
  };
  G.mode = mode; G.total = P.settings.rounds; G.skipped = []; G.revisit = false; G.queue = null;
  if (mode === 'math' && opts.queue) { G.queue = opts.queue.slice(); G.total = G.queue.length; G.practice = true; }
  if (mode === 'math') {
    G.level = P.mathLevel ? Math.max(1, P.mathLevel - 1) : P.settings.mathStart; G.startLevel = G.level;
    G.ms = 0; G.lastType = null;
    try { speechSynthesis.cancel(); } catch (e) {}
  }
  $('game').classList.toggle('math', mode === 'math');
  renderDots(); updateStars();
  show('game');
  later(nextRound, 400);
}

function floorMs(level) { return level < MAX_LEVEL ? LEVEL_MS[level] : MIN_MS; }

function poolFor(level) {
  const maxLen = level === 1 ? 4 : level === 2 ? 5 : 99;
  let p = WORDS.filter(w => label(w).length <= maxLen);
  if (p.length < 6) p = WORDS.slice();
  return p;
}

function pickTarget() {
  const pool = poolFor(G.level).filter(w => !G.recent.includes(w.id));
  const weights = pool.map(w => { const s = stat(w.id); return (1 + s.m * 2) / (1 + s.c * 0.4); });
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

function pickOptions(target) {
  const others = WORDS.filter(w => w.id !== target.id && w.emoji !== target.emoji);
  const tw = label(target).toLowerCase();
  const score = w => { const l = label(w).toLowerCase(); let s = 0; if (l[0] === tw[0]) s += 2; if (l.length === tw.length) s += 1; if (l.slice(-2) === tw.slice(-2)) s += 1; return s; };
  let chosen;
  if (G.level <= 2) chosen = shuffle(others.filter(w => label(w)[0].toLowerCase() !== tw[0])).slice(0, 3);       // fácil: começos diferentes
  else if (G.level === 3) chosen = shuffle(others).slice(0, 3);
  else { const sorted = shuffle(others).sort((a, b) => score(b) - score(a)); chosen = [sorted[0], sorted[1], shuffle(sorted.slice(2))[0]]; } // difícil: palavras parecidas
  for (const w of shuffle(others)) { if (chosen.length >= 3) break; if (!chosen.includes(w)) chosen.push(w); }
  return shuffle([target, ...chosen.slice(0, 3)]);
}

// ---- frases ----
const nWords = t => label(t).split(/\s+/).length;
function showMs() {
  if (!G.target.s) return G.ms;
  return Math.max(2500, Math.round(G.ms * (1 + 0.55 * (nWords(G.target) - 1))));   // mais tempo para frases longas
}
function pickSentence() {
  let pool = SENTENCES.filter(t => !G.recent.includes(t.id) && (G.level > 2 || nWords(t) <= 4));
  if (pool.length < 4) pool = SENTENCES.filter(t => !G.recent.includes(t.id));
  const weights = pool.map(t => { const s = stat(t.id); return (1 + s.m * 2) / (1 + s.c * 0.4); });
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function sentenceOptions(t) {
  const subs = shuffle([...new Set(SENTENCES.map(x => x.s))].filter(x => x !== t.s));
  const objs = shuffle([...new Set(SENTENCES.map(x => x.o))].filter(x => x !== t.o && BYID[x].emoji !== BYID[t.o].emoji));
  const scene = (id, a, b) => ({ id, pic: [BYID[a].emoji, BYID[b].emoji] });
  return shuffle([
    scene(t.id, t.s, t.o),
    scene('x1', subs[0], t.o),          // outro "quem"
    scene('x2', t.s, objs[0]),          // outro "o quê"
    scene('x3', subs[1], objs[1]),      // os dois diferentes
  ]);
}
function wantSentence() {
  const c = P.settings.content;
  if (!SENTENCES.length || c === 'words') return false;
  if (c === 'sentences') return true;
  return Math.random() < 0.35;
}

function sessionOver() {
  return G.round >= G.total || (Date.now() - G.t0) >= P.settings.maxMin * 60000;
}

function nextRound() {
  if (G.mode === 'math') return nextMathRound();
  if (sessionOver()) return endSession();
  const sentence = wantSentence();
  G.target = sentence ? pickSentence() : pickTarget();
  G.recent = [G.target.id, ...G.recent].slice(0, 8);
  G.options = sentence ? sentenceOptions(G.target) : pickOptions(G.target);
  G.attempt = 0;
  stat(G.target.id).s++;
  renderDots();
  $('grid').innerHTML = '';
  flashWord(showMs());
}

// ready-star → word for `ms` → choices
function flashWord(ms) {
  G.locked = true;
  const word = $('word'), ready = $('ready'), hear = $('hear');
  word.classList.remove('hint'); word.classList.toggle('sentence', !!G.target.s); word.textContent = ''; ready.style.display = 'block';
  hear.classList.remove('on');
  $('grid').style.visibility = 'hidden';
  later(() => {
    ready.style.display = 'none';
    word.textContent = label(G.target);
    hear.classList.add('on');
    later(() => {
      word.textContent = ''; hear.classList.remove('on');
      later(showChoices, 120);
    }, ms);
  }, 650);
}

function cardEl(w) {
  const b = document.createElement('button');
  b.className = 'card pop'; b.dataset.id = w.id; b.setAttribute('aria-label', 'Bild');
  if (w.pic) { b.classList.add('scene'); w.pic.forEach(e => { const sp = document.createElement('span'); sp.textContent = e; b.appendChild(sp); }); }
  else if (w.img) { const im = document.createElement('img'); im.src = w.img; im.alt = ''; b.appendChild(im); }
  else b.textContent = w.emoji;
  b.addEventListener('click', () => pick(b, w));
  return b;
}

function showChoices() {
  const grid = $('grid');
  if (!grid.children.length) G.options.forEach((w, i) => { const c = cardEl(w); c.style.animationDelay = (i * 60) + 'ms'; grid.appendChild(c); });
  grid.style.visibility = 'visible';
  if (G.attempt >= 2) {               // 2ª ajuda: a palavra fica na tela e é falada
    const word = $('word'); word.textContent = label(G.target); word.classList.add('hint');
    $('ready').style.display = 'none'; $('hear').classList.add('on');
    speakWord(G.target);
  }
  G.locked = false;
}

function pick(card, w) {
  if (G.locked) return;
  if (w.id === G.target.id) return success(card);
  // never "wrong": card fades gently and the word comes back, longer
  G.locked = true;
  G.attempt++;
  stat(G.target.id).m++;
  card.classList.add('nope');
  sfx.soft();
  save();
  if (G.attempt === 1) later(() => flashWord(Math.min(G.target.s ? 20000 : 5000, Math.round(showMs() * 1.6))), 700);
  else later(showChoices, 500);
}

function success(card) {
  G.locked = true;
  card.classList.add('yes');
  sfx.yes();
  speakWord(G.target);
  const first = G.attempt === 0;
  if (first) {
    G.stars++; stat(G.target.id).c++;
    G.okStreak++; G.errStreak = 0;
    G.ms = Math.max(floorMs(G.level), Math.round(G.ms * 0.94));      // encurta aos poucos
    if (G.okStreak >= 3) { G.okStreak = 0; if (G.level < MAX_LEVEL) { G.level++; G.ms = LEVEL_MS[G.level - 1]; } }
    flyStar(card);
  } else {
    G.okStreak = 0; G.errStreak++;
    if (G.errStreak >= 2) { G.errStreak = 0; if (G.level > 1) G.level--; G.ms = LEVEL_MS[G.level - 1]; }
  }
  G.results.push(first ? 'star' : 'done');
  G.round++;
  cheer(first ? t().cheers[Math.floor(Math.random() * t().cheers.length)] : '👍');
  later(() => { updateStars(); renderDots(); }, 550);
  later(nextRound, 1500);
}

function endSession() {
  clearTimers();
  const l = G.mode === 'math' ? 'math' : lang();
  const isRecord = G.stars > (P.record[l] || 0);
  if (isRecord) P.record[l] = G.stars;
  P.totalStars += G.stars;
  if (G.mode === 'math') { if (!G.practice) P.mathLevel = G.level; } else { P.level[l] = G.level; P.ms[l] = G.ms; }
  P.sessions.unshift({ d: new Date().toISOString(), lang: l, stars: G.stars, rounds: G.round, lvl0: G.startLevel, lvl1: G.level, ms: G.ms, min: Math.round((Date.now() - G.t0) / 6000) / 10 });
  P.sessions = P.sessions.slice(0, 40);
  save();
  $('endTitle').textContent = t().done;
  $('endStars').textContent = t().you(G.stars);
  $('endRecord').textContent = isRecord && G.stars > 0 ? t().record : t().best(P.record[l]);
  show('end');
  sfx.end();
  confetti();
}

/* ---------- visuals ---------- */
function renderDots() {
  const d = $('dots'); d.innerHTML = '';
  const now = G.mode === 'math' ? G.slot : G.round;
  for (let i = 0; i < G.total; i++) {
    const el = document.createElement('i'); const r = G.results[i];
    if (r === 'star') { el.className = 'star'; el.textContent = '⭐'; }
    else if (r === 'done') el.className = 'done';
    else if (r === 'skip') { el.className = 'skip'; el.textContent = '⏭'; if (i === now) el.classList.add('now'); }
    else if (i === now) el.className = 'now';
    d.appendChild(el);
  }
}
function updateStars() { $('starcount').textContent = '⭐ ' + G.stars; }
function cheer(txt) { const c = $('cheer'); c.textContent = txt; c.classList.add('on'); later(() => c.classList.remove('on'), 800); }
function flyStar(fromEl) {
  const s = $('flystar'), a = fromEl.getBoundingClientRect(), b = $('starcount').getBoundingClientRect();
  s.style.display = 'block'; s.style.transition = 'none';
  s.style.left = (a.left + a.width / 2 - 40) + 'px'; s.style.top = (a.top + a.height / 2 - 40) + 'px'; s.style.transform = 'scale(1)';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    s.style.transition = 'left .55s ease-in, top .55s ease-in, transform .55s';
    s.style.left = (b.left + 10) + 'px'; s.style.top = (b.top - 25) + 'px'; s.style.transform = 'scale(.4)';
  }));
  later(() => { s.style.display = 'none'; sfx.star(); }, 560);
}
function confetti() {
  const cv = $('confetti'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  const colors = ['#ff8a3d', '#ffcc33', '#3bb273', '#4d8dff', '#ff5fa2', '#9b6bff'];
  const parts = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .5, vx: (Math.random() - .5) * 4, vy: 3 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)], s: (6 + Math.random() * 8) * devicePixelRatio }));
  const t0 = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (now - t0 < 3500) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const B = id => `<span class="blank" data-b="${id}"></span>`;
const mstat = ty => { const s = P.stats.math || (P.stats.math = {}); return s[ty] || (s[ty] = { s: 0, c: 0, m: 0 }); };

// ---- recursos visuais das dicas ----
function tenField(a, b, op) {           // Zwanzigerfeld: 2 fileiras de 10
  let dots = '';
  for (let i = 0; i < 20; i++) {
    let cls = 'e';
    if (op === '+') cls = i < a ? 'r' : i < a + b ? 'b' : 'e';
    else cls = i < a - b ? 'r' : i < a ? 'x' : 'e';
    dots += `<i class="${cls}"></i>`;
  }
  return `<div class="tenfield">${dots}</div>`;
}
function tensOnes(z, e) {
  return `<div class="tensones">${'<i class="rod"></i>'.repeat(z)}<span>${'<i class="one"></i>'.repeat(e)}</span></div>`;
}
function nline(cells) {               // cells: [[valor, rótulo, destaque]]
  return `<div class="nline">${cells.map(([v, l, q]) => `<span class="${q ? 'q' : ''}"><b>${v}</b><em>${l}</em></span>`).join('<span class="arr">→</span>')}</div>`;
}

// ---- solucionador para muro e triângulo: relações x + y = z ----
function solveOrder(vals, rels, hidden) {
  const known = vals.map((_, i) => !hidden.includes(i)); const order = [];
  let progress = true;
  while (progress) {
    progress = false;
    for (const [x, y, z] of rels) {
      const k = [known[x], known[y], known[z]];
      if (k.filter(Boolean).length !== 2) continue;
      if (!k[2]) { known[z] = true; order.push({ i: z, h: `${vals[x]} + ${vals[y]} = <b>${vals[z]}</b>` }); }
      else if (!k[0]) { known[x] = true; order.push({ i: x, h: `${vals[z]} − ${vals[y]} = <b>${vals[x]}</b>` }); }
      else { known[y] = true; order.push({ i: y, h: `${vals[z]} − ${vals[x]} = <b>${vals[y]}</b>` }); }
      progress = true;
    }
  }
  return known.every(Boolean) ? order : null;
}
function hideCells(vals, rels, target, candidates, mustFirst) {
  let hidden = mustFirst != null ? [mustFirst] : [];
  for (const c of shuffle(candidates)) {
    if (hidden.length >= target) break;
    if (hidden.includes(c)) continue;
    if (solveOrder(vals, rels, [...hidden, c])) hidden.push(c);
  }
  return hidden;
}

// ---- geradores: cada um devolve { type, title, head, steps } ----
// step = { html, blanks:[{id, ans, h2}], choice?:{options:[{label, ok}]}, hint:[h1, h2] }
function genZehner(L) {
  const minus = L >= 2 && Math.random() < 0.5;
  if (!minus) {
    let a, b; do { a = ri(2, 9); b = ri(2, 9); } while (a + b <= 10 || a + b > 18);
    const fill = 10 - a, rest = b - fill;
    return { type: 'zehner', title: 'Rechne über den Zehner!', steps: [{
      html: `<div class="eq">${a} + ${b} = ${B('r')}</div>`, blanks: [{ id: 'r', ans: a + b }],
      hint: [`${tenField(a, b, '+')}<p>Erst bis 10: ${a} + <b>${fill}</b> = 10. Dann noch <b>${rest}</b> dazu.</p>`,
             `<p>${a} + ${fill} + ${rest} = 10 + ${rest} = <b>${a + b}</b></p>`] }] };
  }
  let m, s; do { m = ri(11, 18); s = ri(2, 9); } while (s <= m % 10);
  const back = m - 10, rest = s - back;
  return { type: 'zehner', title: 'Rechne über den Zehner!', steps: [{
    html: `<div class="eq">${m} − ${s} = ${B('r')}</div>`, blanks: [{ id: 'r', ans: m - s }],
    hint: [`${tenField(m, s, '-')}<p>Erst zurück bis 10: ${m} − <b>${back}</b> = 10. Dann noch <b>${rest}</b> weg.</p>`,
           `<p>${m} − ${back} − ${rest} = 10 − ${rest} = <b>${m - s}</b></p>`] }] };
}

function genPlatzhalter(L) {
  const forms = L === 1 ? ['x+b', 'a+x'] : ['x+b', 'a+x', 'x-b', 'a-x'];
  const f = pickOne(forms);
  let a, b; do { a = ri(2, 9); b = ri(2, 9); } while (a + b <= 10 || a + b > 18);
  const c = a + b;
  const step = (html, ans, h1, h2) => ({ type: 'platzhalter', title: 'Rechne mit Platzhalter!', steps: [{ html: `<div class="eq">${html}</div>`, blanks: [{ id: 'r', ans }], hint: [h1, h2] }] });
  if (f === 'x+b') return step(`${B('r')} + ${b} = ${c}`, a, `<p>Welche Zahl plus ${b} gibt ${c}?<br>Rechne rückwärts: <b>${c} − ${b}</b></p>`, `<p>${c} − ${b} = <b>${a}</b>, denn ${a} + ${b} = ${c}</p>`);
  if (f === 'a+x') return step(`${a} + ${B('r')} = ${c}`, b, `<p>Von ${a} bis ${c}: wie viele fehlen?<br>Rechne: <b>${c} − ${a}</b></p>`, `<p>${c} − ${a} = <b>${b}</b>, denn ${a} + ${b} = ${c}</p>`);
  let m, s; do { m = ri(11, 19); s = ri(2, 9); } while (m - s < 2);
  const r = m - s;
  if (f === 'x-b') return step(`${B('r')} − ${s} = ${r}`, m, `<p>Welche Zahl minus ${s} gibt ${r}?<br>Rechne rückwärts: <b>${r} + ${s}</b></p>`, `<p>${r} + ${s} = <b>${m}</b>, denn ${m} − ${s} = ${r}</p>`);
  return step(`${m} − ${B('r')} = ${r}`, s, `<p>Von ${m} zurück bis ${r}: wie viele weg?<br>Rechne: <b>${m} − ${r}</b></p>`, `<p>${m} − ${r} = <b>${s}</b>, denn ${m} − ${s} = ${r}</p>`);
}

function genUmkehr(L) {
  const minus = L >= 2 && Math.random() < 0.5;
  let a, b; do { a = ri(3, 14); b = ri(2, 9); } while (a + b > 20);
  const c = a + b;
  if (!minus) return { type: 'umkehr', title: 'Rechne und bilde die Umkehraufgabe!', steps: [
    { html: `<div class="eq">${a} + ${b} = ${B('r1')}</div>`, blanks: [{ id: 'r1', ans: c }], hint: [`<p>Rechne ${a} + ${b}.</p>`, `<p>${a} + ${b} = <b>${c}</b></p>`] },
    { html: `<div class="eq sub">Umkehraufgabe: ${c} <span class="opslot">?</span> ${b} = ${B('r2')}</div>`, choice: { options: [{ label: '+', ok: false }, { label: '−', ok: true }] }, blanks: [{ id: 'r2', ans: a }],
      hint: [`<p>Die Umkehraufgabe rechnet <b>zurück</b>.<br>Aus <b>+</b> wird <b>−</b>.</p>`, `<p>${c} − ${b} = <b>${a}</b> — wir sind wieder bei ${a}!</p>`] }] };
  return { type: 'umkehr', title: 'Rechne und bilde die Umkehraufgabe!', steps: [
    { html: `<div class="eq">${c} − ${b} = ${B('r1')}</div>`, blanks: [{ id: 'r1', ans: a }], hint: [`<p>Rechne ${c} − ${b}.</p>`, `<p>${c} − ${b} = <b>${a}</b></p>`] },
    { html: `<div class="eq sub">Umkehraufgabe: ${a} <span class="opslot">?</span> ${b} = ${B('r2')}</div>`, choice: { options: [{ label: '+', ok: true }, { label: '−', ok: false }] }, blanks: [{ id: 'r2', ans: c }],
      hint: [`<p>Die Umkehraufgabe rechnet <b>zurück</b>.<br>Aus <b>−</b> wird <b>+</b>.</p>`, `<p>${a} + ${b} = <b>${c}</b> — wir sind wieder bei ${c}!</p>`] }] };
}

function genWelche(L) {
  const kinds = L === 1 ? ['vorg', 'nachf'] : L === 2 ? ['vorg', 'nachf', 'vorgZE', 'nachfZE'] : ['vorg', 'nachf', 'vorgZE', 'nachfZE', 'doppelt', 'groesser', 'kleiner'];
  const k = pickOne(kinds);
  const mk = (text, ans, h1, h2) => ({ type: 'welche', title: 'Welche Zahl ist es?',
    head: `<div class="wtext">${text}</div>`,
    steps: [{ html: `<div class="eq sub">Die Zahl ist ${B('r')}</div>`, blanks: [{ id: 'r', ans }], hint: [h1, h2] }] });
  const ruleV = `<p>Der <b>Vorgänger</b> kommt <b>vor</b> der Zahl.<br>Die Zahl ist also <b>1 mehr</b>.</p>`;
  const ruleN = `<p>Der <b>Nachfolger</b> kommt <b>nach</b> der Zahl.<br>Die Zahl ist also <b>1 weniger</b>.</p>`;
  if (k === 'vorg') { const n = ri(10, 98); return mk(`Der Vorgänger ist ${n}.`, n + 1, nline([[n, 'Vorgänger'], ['?', 'die Zahl', 1], [n + 2, 'Nachfolger']]) + ruleV, `<p>${n} + 1 = <b>${n + 1}</b></p>`); }
  if (k === 'nachf') { const n = ri(11, 99); return mk(`Der Nachfolger ist ${n}.`, n - 1, nline([[n - 2, 'Vorgänger'], ['?', 'die Zahl', 1], [n, 'Nachfolger']]) + ruleN, `<p>${n} − 1 = <b>${n - 1}</b></p>`); }
  if (k === 'vorgZE' || k === 'nachfZE') {
    let z, e, v; do { z = ri(1, 8); e = ri(0, 9); v = z * 10 + e; } while (v < 11 || v > 98);
    const vorg = k === 'vorgZE', ans = vorg ? v + 1 : v - 1;
    return mk(`Der ${vorg ? 'Vorgänger' : 'Nachfolger'} hat ${z} Zehner und ${e} Einer.`, ans,
      `${tensOnes(z, e)}<p>${z} Zehner und ${e} Einer = <b>${v}</b>.</p>` + (vorg ? ruleV : ruleN),
      `<p>Der ${vorg ? 'Vorgänger' : 'Nachfolger'} ist ${v}. ${v} ${vorg ? '+' : '−'} 1 = <b>${ans}</b></p>`);
  }
  if (k === 'doppelt') { const n = pickOne([10, 15, 20, 25, 30, 35, 40, 45, 50]), d = 2 * n;
    return mk(`Der Nachfolger ist doppelt so groß wie ${n}.`, d - 1,
      `<p>Doppelt so groß wie ${n}: ${n} + ${n} = <b>${d}</b>.<br>${d} ist der <b>Nachfolger</b>.</p>` + ruleN, `<p>${d} − 1 = <b>${d - 1}</b></p>`); }
  if (k === 'groesser') { const n = ri(12, 80), d = ri(2, 10);
    return mk(`Die Zahl ist ${d} größer als ${n}.`, n + d,
      `<p><b>größer</b> heißt <b>plus</b>: ${n} + ${d}</p>`, `<p>${n} + ${d} = <b>${n + d}</b></p>`); }
  const n = ri(15, 90), d = ri(2, 9);
  return mk(`Die Zahl ist ${d} kleiner als ${n}.`, n - d,
    `<p><b>kleiner</b> heißt <b>minus</b>: ${n} − ${d}</p>`, `<p>${n} − ${d} = <b>${n - d}</b></p>`);
}

function genMauer(L) {
  const n = L >= 3 ? 4 : 3;
  let base, rows;
  for (;;) {
    base = Array.from({ length: n }, () => ri(n === 4 ? 0 : 1, n === 4 ? 5 : 7));
    rows = [base]; while (rows[rows.length - 1].length > 1) { const p = rows[rows.length - 1]; rows.push(p.slice(1).map((v, i) => p[i] + v)); }
    if (rows[rows.length - 1][0] <= (n === 4 ? 30 : 20)) break;
  }
  // índice linear das células
  const idx = []; const vals = []; rows.forEach((r, ri_) => { idx.push(r.map(v => { vals.push(v); return vals.length - 1; })); });
  const rels = []; for (let r = 1; r < rows.length; r++) for (let i = 0; i < rows[r].length; i++) rels.push([idx[r - 1][i], idx[r - 1][i + 1], idx[r][i]]);
  const upper = idx.slice(1).flat(), all = idx.flat();
  const hidden = L === 1 ? upper.slice() : L === 2 ? hideCells(vals, rels, 3, all, pickOne(idx[0])) : hideCells(vals, rels, 5, all, pickOne(idx[0]));
  const order = solveOrder(vals, rels, hidden);
  let html = '<div class="wall">';
  for (let r = rows.length - 1; r >= 0; r--) html += `<div class="wrow">${idx[r].map(i => `<div class="brick">${hidden.includes(i) ? B('c' + i) : vals[i]}</div>`).join('')}</div>`;
  html += '</div>';
  return { type: 'mauer', title: 'Fülle die Rechenmauer aus!', steps: [{ html, blanks: order.map(o => ({ id: 'c' + o.i, ans: vals[o.i], h2: `<p>${o.h}</p>` })),
    hint: [`<p>Zwei Steine nebeneinander ergeben <b>zusammen</b> den Stein darüber.<br>Fehlt unten ein Stein: oben <b>minus</b> den Nachbarn.</p>`, ''] }] };
}

function genDreieck(L) {
  let a, b, c; do { a = ri(1, 9); b = ri(1, 9); c = ri(1, 9); } while (a + b > 18 || a + c > 18 || b + c > 18);
  // índices: 0 topo, 1 baixo-esq, 2 baixo-dir, 3 lado esq (0+1), 4 lado dir (0+2), 5 base (1+2)
  const vals = [a, b, c, a + b, a + c, b + c];
  const rels = [[0, 1, 3], [0, 2, 4], [1, 2, 5]];
  const hidden = L === 1 ? [3, 4, 5] : L === 2 ? hideCells(vals, rels, 3, [0, 1, 2, 3, 4, 5], pickOne([0, 1, 2])) : hideCells(vals, rels, 4, [0, 1, 2, 3, 4, 5], pickOne([0, 1, 2]));
  const order = solveOrder(vals, rels, hidden);
  const cell = i => hidden.includes(i) ? B('c' + i) : `<span class="given">${vals[i]}</span>`;
  const html = `<div class="tri"><svg viewBox="0 0 300 300" aria-hidden="true"><polygon points="150,18 282,246 18,246"/><line x1="150" y1="170" x2="150" y2="246"/><line x1="150" y1="170" x2="84" y2="132"/><line x1="150" y1="170" x2="216" y2="132"/></svg>
    <div class="tin t0">${cell(0)}</div><div class="tin t1">${cell(1)}</div><div class="tin t2">${cell(2)}</div>
    <div class="tout o3">${cell(3)}</div><div class="tout o4">${cell(4)}</div><div class="tout o5">${cell(5)}</div></div>`;
  return { type: 'dreieck', title: 'Löse das Rechendreieck!', steps: [{ html, blanks: order.map(o => ({ id: 'c' + o.i, ans: vals[o.i], h2: `<p>${o.h}</p>` })),
    hint: [`<p>Die Zahl <b>außen</b> ist immer die Summe der <b>zwei Zahlen innen</b> daneben.<br>Fehlt innen eine Zahl: außen <b>minus</b> die andere.</p>`, ''] }] };
}

function genGeschichte(L) {
  const [name, pron] = pickOne(PEOPLE); const Pron = pron[0].toUpperCase() + pron.slice(1);
  const money = L === 1 ? false : L === 2 ? Math.random() < 0.5 : true;
  let items, total;
  for (;;) {
    const cnt = L === 1 ? 2 : L === 2 ? ri(2, 3) : 3;
    items = shuffle(SHOP).slice(0, cnt).map(it => ({ ...it, q: it.id === 'postkarte' ? ri(1, 3) : 1 }));
    total = items.reduce((s, it) => s + it.price * it.q, 0);
    if (money ? (total >= 6 && total <= 18) : total <= 20) break;
  }
  const phrase = it => it.id === 'postkarte' ? (it.q === 1 ? 'eine Postkarte' : `${NUMWORD[it.q]} Postkarten`) : ACC[it.id];
  const list = items.map(phrase); const text = `${name} kauft ${list.slice(0, -1).join(', ')} und ${list[list.length - 1]}.`;
  const q = money ? `${Pron} hat 20 € dabei. Wie viel Euro bekommt ${pron} zurück?` : `Wie viel muss ${pron} bezahlen?`;
  const shop = `<div class="shop">${SHOP.map(it => `<div class="ware"><span>${it.emoji}</span><b>${it.name}</b><em>${it.price} €</em></div>`).join('')}</div>`;
  const parts = items.map(it => it.price * it.q);
  const steps = [{
    html: `<div class="eq sub"><span class="tag">R:</span> ${items.map((_, i) => B('p' + i) + ' €').join(' + ')} = ${B('t')} €</div>`,
    blanks: [...items.map((it, i) => ({ id: 'p' + i, ans: it.price * it.q, h2: `<p>${it.q > 1 ? `${NUMWORD[it.q]} Postkarten: ${Array(it.q).fill('1 €').join(' + ')}` : `${it.name}: ${it.price} €`} = <b>${it.price * it.q} €</b></p>` })),
             { id: 't', ans: total, h2: `<p>${parts.join(' + ')} = <b>${total}</b></p>` }],
    hint: [`<p>Schau auf die <b>Preisschilder</b> im Laden.<br>Erst jeden Preis, dann <b>alles zusammen</b>.</p>`, ''] }];
  if (money) steps.push({
    html: `<div class="eq sub"><span class="tag">R:</span> 20 € − ${B('t2')} € = ${B('z')} €</div>`,
    blanks: [{ id: 't2', ans: total, h2: `<p>Sie bezahlt <b>${total} €</b> (das hast du gerade gerechnet).</p>` }, { id: 'z', ans: 20 - total, h2: `<p>20 − ${total} = <b>${20 - total}</b></p>` }],
    hint: [`<p>${name} gibt <b>20 €</b> und bezahlt <b>${total} €</b>.<br>Was übrig bleibt, bekommt ${pron} <b>zurück</b> → <b>minus</b>!</p>`, ''] });
  const opts = money
    ? [{ label: `${name} bekommt ${20 - total} € zurück.`, ok: true }, { label: `${name} muss 20 € bezahlen.`, ok: false }, { label: `${name} bekommt ${total} € zurück.`, ok: false }]
    : [{ label: `${name} muss ${total} € bezahlen.`, ok: true }, { label: `${name} bekommt ${total} € zurück.`, ok: false }, { label: `${name} muss ${total + pickOne([1, 2, 3])} € bezahlen.`, ok: false }];
  steps.push({ html: `<div class="eq sub"><span class="tag">A:</span> Welcher Antwortsatz passt?</div>`, answer: true, choice: { options: shuffle(opts) }, blanks: [],
    hint: [`<p>Lies die Frage noch einmal:<br><b>${q}</b></p>`, ''] });
  return { type: 'geschichte', title: 'Rechengeschichte', head: `${shop}<div class="wtext story">${text}<br><b>F:</b> ${q}</div>`, steps };
}
const GENS = { zehner: genZehner, platzhalter: genPlatzhalter, umkehr: genUmkehr, welche: genWelche, mauer: genMauer, dreieck: genDreieck, geschichte: genGeschichte };

let M = null;
function pickMathType() {
  if (window.__forceMath) return window.__forceMath;           // só para testes
  const en = Object.keys(MATH_TYPES).filter(k => (P.settings.mathTypes || {})[k] !== false);
  const pool = en.length ? en : Object.keys(MATH_TYPES);
  const cand = pool.filter(k => k !== G.lastType);
  const list = cand.length ? cand : pool;
  const w = list.map(k => { const s = mstat(k); return (1 + s.m * 1.5) / (1 + s.c * 0.3); });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}

const cloneTask = t => JSON.parse(JSON.stringify(t));
function nextMathRound() {
  let task, slot;
  if (!G.revisit && !sessionOver()) {
    slot = G.round;
    if (G.queue) task = cloneTask(G.queue.shift());
    else { const ty = pickMathType(); G.lastType = ty; task = GENS[ty](G.level); }
  } else if (G.skipped.length) {
    if (!G.revisit) {               // como na prova: no fim, voltar aos que pulou
      G.revisit = true;
      const bn = document.createElement('div'); bn.className = 'banner'; bn.innerHTML = '<div>⏭ Jetzt die übersprungenen Aufgaben!</div>';
      document.body.appendChild(bn); later(() => bn.remove(), 1900);
      later(nextMathRound, 2000); return;
    }
    const it = G.skipped.shift(); task = cloneTask(it.task); slot = it.idx;
  } else return endSession();
  G.slot = slot;
  startTask(task);
}
function startTask(task) {
  const ty = task.type;
  $('mside').classList.remove('hide'); $('mtask').scrollTop = 0;
  M = { task, orig: cloneTask(task), step: -1, blanks: [], active: null, typed: '', errs: 0, blankErrs: 0, choiceDone: false, markId: null };
  resetTools();
  mstat(ty).s++;
  renderDots();
  $('mtitle').textContent = task.title;
  $('mhead').innerHTML = task.head || '';
  $('msteps').innerHTML = '';
  $('mhint').innerHTML = ''; $('mhint').classList.remove('on');
  $('mtask').classList.toggle('wide', ty === 'geschichte');
  nextStep();
}

function nextStep() {
  M.step++;
  if (M.step >= M.task.steps.length) return mathSuccess();
  const st = M.task.steps[M.step];
  const div = document.createElement('div'); div.className = 'mstep pop'; div.innerHTML = st.html; $('msteps').appendChild(div);
  M.stepEl = div; M.blankErrs = 0; M.choiceDone = !st.choice;
  M.blanks = st.blanks.map(b => ({ ...b, el: div.querySelector(`[data-b="${b.id}"]`), done: false }));
  M.blanks.forEach(b => b.el.addEventListener('click', () => { if (M.choiceDone && !b.done) setActive(b); }));
  $('mhint').classList.remove('on');
  if (st.choice) {
    const box = document.createElement('div'); box.className = st.answer ? 'mchoice answers' : 'mchoice';
    st.choice.options.forEach(o => {
      const btn = document.createElement('button'); btn.textContent = o.label;
      btn.addEventListener('click', () => chooseOpt(btn, o, st));
      box.appendChild(btn);
    });
    div.appendChild(box);
    $('keypad').classList.add('off');
    $('mside').classList.toggle('hide', !!st.answer);
    setActive(null);
  } else {
    $('keypad').classList.remove('off'); $('mside').classList.remove('hide');
    setActive(M.blanks.find(b => !b.done));
  }
  later(() => div.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 80);
  M.locked = false;
}

function setActive(b) {
  M.blanks.forEach(x => x.el.classList.toggle('active', x === b));
  M.active = b; M.typed = ''; if (b) renderBlank(b);
}
function renderBlank(b) { b.el.textContent = M.typed; b.el.classList.toggle('typed', !!M.typed); }

function showHint(st, blank) {
  const lvl = Math.min(M.blankErrs, 2);
  const h = lvl >= 2 ? st.hint[0] + ((blank && blank.h2) || st.hint[1] || '') : st.hint[0];
  $('mhint').innerHTML = `<div class="hicon">💡</div><div>${h}</div>`; $('mhint').classList.add('on');
}

function chooseOpt(btn, o, st) {
  if (M.locked || M.choiceDone) return;
  if (o.ok) {
    btn.classList.add('ok'); sfx.yes();
    const slot = M.stepEl.querySelector('.opslot'); if (slot) { slot.textContent = o.label; slot.classList.add('set'); }
    M.choiceDone = true;
    later(() => {
      if (!st.answer) { const box = M.stepEl.querySelector('.mchoice'); if (box) box.remove(); }
      else M.stepEl.querySelectorAll('.mchoice button:not(.ok)').forEach(x => x.classList.add('gone'));
      $('mhint').classList.remove('on');
      if (M.blanks.length) { $('keypad').classList.remove('off'); M.blankErrs = 0; setActive(M.blanks.find(b => !b.done)); }
      else nextStep();
    }, 450);
  } else {
    M.errs++; M.blankErrs++; mstat(M.task.type).m++; save();
    btn.classList.add('nope'); sfx.soft(); showHint(st, null);
  }
}

function keyPress(k) {
  if (!M || M.locked || !M.choiceDone || !M.active) return;
  const b = M.active;
  if (k === 'del') { M.typed = M.typed.slice(0, -1); renderBlank(b); return; }
  if (k === 'ok') return checkBlank();
  if (M.typed.length >= 3) return;
  M.typed += k; renderBlank(b); tone(520 + Number(k) * 30, 0, .06, 'sine', .05);
}

function checkBlank() {
  const b = M.active, st = M.task.steps[M.step];
  if (!M.typed) return;
  if (Number(M.typed) === b.ans) {
    b.done = true; b.el.textContent = b.ans; b.el.classList.remove('active', 'typed', 'ghost'); b.el.classList.add('ok');
    sfx.yes(); M.blankErrs = 0; $('mhint').classList.remove('on');
    const nb = M.blanks.find(x => !x.done);
    if (nb) setActive(nb); else { M.locked = true; setActive(null); later(nextStep, 500); }
  } else {
    M.errs++; M.blankErrs++; mstat(M.task.type).m++; save();
    sfx.soft(); b.el.classList.remove('shake'); void b.el.offsetWidth; b.el.classList.add('shake');
    M.typed = ''; renderBlank(b);
    if (M.blankErrs >= 2) { b.el.dataset.ghost = b.ans; b.el.classList.add('ghost'); }
    showHint(st, b);
  }
}

function mathSuccess() {
  const first = M.errs === 0;
  M.locked = true;
  $('keypad').classList.add('off');
  if (first) {
    G.stars++; mstat(M.task.type).c++; G.okStreak++; G.errStreak = 0;
    if (G.okStreak >= 3) { G.okStreak = 0; if (G.level < MATH_LEVELS) G.level++; }
    flyStar($('mtask'));
  } else {
    G.okStreak = 0; G.errStreak++;
    if (G.errStreak >= 2) { G.errStreak = 0; if (G.level > 1) G.level--; }
  }
  save();
  G.results[G.slot] = first ? 'star' : 'done'; if (!G.revisit) G.round++;
  cheer(first ? t().cheers[Math.floor(Math.random() * t().cheers.length)] : '👍');
  later(() => { updateStars(); renderDots(); }, 550);
  later(nextMathRound, 1700);
}

  const row = ({ w, x }) => `<tr><td>${w.emoji} ${w[l] || w.de}</td><td>${x.s}</td><td>${x.c}</td><td>${x.m}</td></tr>`;
  $('sheet').innerHTML = `
    <div class="sheethead"><div class="seg"><button id="backParents">‹ Voltar</button></div><button class="xbtn" id="closeParents" aria-label="Fechar">✕</button></div>
    <h2 style="margin-top:14px">Palavras (${WORDS.length}, ${l.toUpperCase()})</h2>
    <div class="muted">Já vistas: ${seen.length} · Ainda não apareceram: ${unseen.length}</div>
    <h3>Já vistas — mais difíceis primeiro</h3>
    ${seen.length ? `<table><tr><th>Palavra</th><th>Vista</th><th>De primeira</th><th>Erros</th></tr>${seen.map(row).join('')}</table>` : '<div class="muted">Nenhuma ainda.</div>'}
    <h3>Ainda não apareceram</h3>
    <div style="line-height:1.9">${unseen.map(({ w }) => `<span style="white-space:nowrap; margin-right:14px">${w.emoji} ${w[l] || w.de}</span>`).join('') || '<span class="muted">Todas já apareceram! 🎉</span>'}</div>
    <h3>Frases (${SENTENCES.length})</h3>
    <table><tr><th>Frase</th><th>Vista</th><th>De primeira</th><th>Erros</th></tr>${SENTENCES.map(t => ({ w: t, x: st[t.id] || { s: 0, c: 0, m: 0 } })).filter(r => r.x.s > 0).sort((a, b) => (b.x.m - b.x.c * .5) - (a.x.m - a.x.c * .5)).map(({ w, x }) => `<tr><td>${BYID[w.s].emoji}${BYID[w.o].emoji} ${w[l]}</td><td>${x.s}</td><td>${x.c}</td><td>${x.m}</td></tr>`).join('') || '<tr><td class="muted" colspan="4">Nenhuma frase vista ainda.</td></tr>'}</table>
    <div class="muted" style="margin-top:16px">Para trocar as palavras, edite a lista JSON no topo do arquivo index.html.</div>
    <div class="row"><span></span><button class="ok" id="backParents2">‹ Voltar</button></div>`;
  $('sheet').scrollTop = 0;
  $('backParents').onclick = $('backParents2').onclick = openParents;
  $('closeParents').onclick = () => { $('parents').classList.remove('on'); renderHome(); };
}
function levelInfo(L) {
  const fmt = x => (x / 1000).toFixed(1).replace('.', ',') + ' s';
  const ms = LEVEL_MS[L - 1];
  const ns = SENTENCES.map(nWords).filter(n => L > 2 || n <= 4);
  const sMs = n => Math.max(2500, Math.round(ms * (1 + 0.55 * (n - 1))));
  const words = L === 1 ? 'só palavras curtas, de até 4 letras (Ei, Kuh, Haus)'
    : L === 2 ? 'palavras de até 5 letras (Katze, Apfel)'
    : 'todas as palavras, inclusive as longas (Schildkröte, Schmetterling)';
  const opts = L <= 2 ? 'as imagens erradas começam com letras bem diferentes, fácil de distinguir'
    : L === 3 ? 'as imagens erradas são sorteadas'
    : 'as imagens erradas são de palavras parecidas (Maus · Mais · Mond), é preciso ler a palavra inteira';
  const sent = ns.length ? `Frases ${L <= 2 ? 'curtas (até 4 palavras)' : 'de todos os tamanhos'}: ${fmt(sMs(Math.min(...ns)))} a ${fmt(sMs(Math.max(...ns)))} na tela.` : '';
  return `<b>Nível ${L}:</b> a palavra fica <b>${fmt(ms)}</b> na tela; ${words}; ${opts}. ${sent}`;
}
let diffOpen = false, mathOpen = false, parentTab = 'geral';
function mathLevelInfo(L) {
  return ['',
    '<b>Nível 1:</b> só somas passando a dezena (8 + 5); número que falta só com +; antecessor/sucessor ("Der Vorgänger ist 57"); muro e triângulo: só somar para achar os de cima/de fora; lojinha com 2 coisas, só o total.',
    '<b>Nível 2:</b> entra a subtração (14 − 6) e a conta inversa com −; dezenas e unidades ("5 Zehner und 6 Einer"); muro e triângulo com um número faltando embaixo/dentro (precisa subtrair); lojinha às vezes com troco de 20 €.',
    '<b>Nível 3:</b> "doppelt so groß wie", "5 größer/kleiner als"; muro de 4 andares; triângulo com mais números faltando; lojinha com 3 coisas e sempre com troco.'][L];
}
function openParents() {
  const s = P.settings;
  const seg = (key, opts) => `<div class="seg" data-key="${key}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(s[key]) === String(v) ? 'sel' : ''}">${l}</button>`).join('')}</div>`;
  const st = P.stats[s.lang];
  const modeLabel = q => q.lang === 'math' ? '🔢 Rechnen' : '📖 ' + q.lang.toUpperCase();
  const sess = P.sessions.slice(0, 10).map(q => `<tr><td>${new Date(q.d).toLocaleDateString('pt-BR')} ${new Date(q.d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</td><td>${modeLabel(q)}</td><td>⭐ ${q.stars}/${q.rounds}</td><td>nível ${q.lvl0}→${q.lvl1}</td><td>${q.lang === 'math' ? '—' : (q.ms / 1000).toFixed(2) + ' s'}</td></tr>`).join('') || '<tr><td class="muted">Nenhuma sessão ainda.</td></tr>';
  const curLvl = P.level[s.lang];
  const tabs = [['geral', '⚙️ Geral'], ['lesen', '📖 Lesen'], ['rechnen', '🔢 Rechnen']];
  const body = {
    geral: `
    <div class="muted">Versão ${APP_VERSION} · <a href="#" id="updNow">verificar atualização</a></div>
    <h3>Tema</h3>${seg('theme', Object.entries(THEMES).map(([k, v]) => [k, v.mascot + ' ' + v.name]))}
    <h3>Sessão</h3>${seg('rounds', [[5, '5 rodadas'], [10, '10 rodadas'], [15, '15 rodadas']])}
    <div style="height:8px"></div>${seg('maxMin', [[3, 'máx. 3 min'], [5, 'máx. 5 min'], [8, 'máx. 8 min']])}
    <div class="explain">Vale para Lesen e Rechnen. A sessão termina no que vier primeiro: ${s.rounds} rodadas ou ${s.maxMin} minutos. No Rechnen, depois disso ela ainda volta aos exercícios que pulou.</div>
    <h3>Sons</h3>${seg('sound', [[true, '🔊 Sons ligados'], [false, '🔇 Sons desligados']])}
    <div class="explain">Sons são os efeitos de acerto e estrela. A voz que lê as palavras do Lesen continua funcionando mesmo com os sons desligados.</div>
    <h3>Foto da Lara</h3>
    <div class="seg"><button id="photoPick">📷 ${getAvatar() ? 'Trocar foto' : 'Escolher foto'}</button>${getAvatar() ? '<button id="photoDel">Remover foto (volta o mascote)</button>' : ''}</div>
    <h3>Últimas sessões</h3>
    <table><tr><th>Quando</th><th></th><th>Estrelas</th><th>Nível</th><th>Tempo final</th></tr>${sess}</table>
    <div class="row"><button class="danger" id="resetBtn">Zerar progresso</button></div>`,
    lesen: `
    <div class="muted">Nível atual (${s.lang.toUpperCase()}): ${curLvl ? curLvl + ' · palavra aparece ' + (P.ms[s.lang] / 1000).toFixed(2) + ' s' : 'ainda não jogou'}</div>
    <h3>Idioma das palavras</h3>${seg('lang', [['de', 'Deutsch'], ['pt', 'Português']])}
    <h3>Dificuldade inicial</h3>${seg('startLevel', LEVEL_MS.map((ms, i) => [i + 1, `${i + 1} · ${(ms / 1000).toFixed(1).replace('.', ',')} s`]))}
    <div class="explain">${levelInfo(s.startLevel)}
      <details id="diffMore"${diffOpen ? ' open' : ''}>
        <summary>Como a dificuldade muda durante o jogo</summary>
        <div class="more">
          Este nível é só o <b>ponto de partida</b>. Durante o jogo a dificuldade muda sozinha:<br>
          • Acertou de primeira → a próxima palavra fica um pouquinho menos tempo na tela.<br>
          • Acertou de primeira 3 vezes seguidas → sobe 1 nível.<br>
          • Errou em 2 rodadas seguidas → desce 1 nível.<br>
          O jogo lembra onde ela parou e, na próxima vez, começa 1 nível abaixo para aquecer. Escolher um nível aqui apaga essa memória e recomeça do nível escolhido.
        </div>
      </details>
    </div>
    <h3>Conteúdo</h3>${seg('content', [['mix', 'Palavras + frases'], ['words', 'Só palavras'], ['sentences', 'Só frases']])}
    <div class="explain">${s.content === 'mix' ? 'Cerca de 1 em cada 3 rodadas é uma frase; as outras são palavras soltas.' : s.content === 'words' ? 'Só palavras soltas: treina reconhecer a palavra rápido.' : 'Só frases: depois da frase aparecem 4 cenas; as erradas trocam quem faz a ação ou o objeto, então é preciso ler a frase toda.'}</div>
    <h3>Voz (${s.lang.toUpperCase()})</h3>
    <div class="muted">Toque numa voz para ouvir e escolher.</div>
    <div class="seg" id="recList" style="margin-top:8px">${RECORDED[s.lang].map(([k, n]) => `<button data-rec="${k}" class="${recKey() === k ? 'sel' : ''}">🎙️ ${n}</button>`).join('')}</div>
    <h3>Palavras e frases</h3>
    <div class="seg"><button id="wordsBtn">📚 Ver as ${WORDS.length} palavras, frases e estatísticas ›</button></div>`,
    rechnen: `
    <div class="muted">Nível atual: ${P.mathLevel ? P.mathLevel : 'ainda não jogou'} · os enunciados não são lidos em voz alta</div>
    <h3>Exercícios para revisar</h3>
    <div class="seg"><button id="reviewBtn">🔖 Marcados (${P.marked.length}) · ⏭ Pulados (${P.skipLog.length}) ›</button></div>
    <h3>Nível inicial</h3>${seg('mathStart', [[1, 'Nível 1'], [2, 'Nível 2'], [3, 'Nível 3']])}
    <div class="explain">${mathLevelInfo(s.mathStart)}
      <details id="mathMore"${mathOpen ? ' open' : ''}>
        <summary>Como o nível muda durante o jogo</summary>
        <div class="more">Sobe 1 nível após 3 exercícios certos de primeira; desce após 2 exercícios com erro ou pulados. Na próxima vez começa 1 nível abaixo de onde parou. Escolher um nível aqui apaga essa memória.</div>
      </details>
    </div>
    <h3>Tipos de exercício</h3>
    <div class="muted" style="margin-bottom:8px">Toque para ligar/desligar. Os que ela mais erra aparecem com mais frequência.</div>
    <div class="seg" id="mtypes">${Object.entries(MATH_TYPES).map(([k, v]) => `<button data-mt="${k}" class="${(s.mathTypes || {})[k] !== false ? 'sel' : ''}">${v.de}</button>`).join('')}</div>
    <h3>Resultados por tipo</h3>
    <table><tr><th>Tipo</th><th>Vistos</th><th>De primeira</th><th>Erros</th><th>Pulados</th></tr>${Object.entries(MATH_TYPES).map(([k, v]) => { const x = (P.stats.math || {})[k] || { s: 0, c: 0, m: 0 }; return `<tr><td>${v.de}<br><span class="muted">${v.pt}</span></td><td>${x.s}</td><td>${x.c}</td><td>${x.m}</td><td>${x.k || 0}</td></tr>`; }).join('')}</table>`,
  };
  $('sheet').innerHTML = `
    <div class="sheethead tabbed"><div class="hrow"><h2>Modo pais</h2><button class="xbtn" id="closeParents" aria-label="Fechar">✕</button></div>
      <div class="ptabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${parentTab === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    ${body[parentTab]}`;
  $('sheet').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { parentTab = b.dataset.tab; openParents(); $('sheet').scrollTop = 0; });
  $('sheet').querySelectorAll('.seg').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mt) {
      const mt = Object.assign({}, P.settings.mathTypes); const on = mt[b.dataset.mt] !== false;
      const active = Object.keys(MATH_TYPES).filter(k => mt[k] !== false);
      if (on && active.length <= 1) return;                       // pelo menos um tipo ligado
      mt[b.dataset.mt] = !on; P.settings.mathTypes = mt; save(); openParents(); return;
    }
    if (b.dataset.rec) {
      P.settings.rec = Object.assign({}, P.settings.rec, { [lang()]: b.dataset.rec });
      save(); speakHello(); prefetchVoice(); openParents();
      return;
    }
    if (b.dataset.uri) {
      const two = lang();
      P.settings.voice = Object.assign({}, P.settings.voice, { [two]: b.dataset.uri });
      save(); speakHello();
      g.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b));
      return;
    }
    if (!g.dataset.key) return;
    const key = g.dataset.key; let v = b.dataset.v;
    if (v === 'true' || v === 'false') v = v === 'true'; else if (!isNaN(Number(v))) v = Number(v);
    P.settings[key] = v;
    if (key === 'startLevel') { P.level[s.lang] = null; P.ms[s.lang] = null; }
    if (key === 'mathStart') P.mathLevel = null;
    save(); applyTheme(); openParents();
  }));
  const on = (id, fn) => { if ($(id)) fn($(id)); };
  on('resetBtn', el => el.onclick = () => { if (confirm('Apagar estrelas, recordes, estatísticas e exercícios marcados?')) { const keep = P.settings; P = clone(DEFAULTS); P.settings = keep; save(); openParents(); } });
  on('wordsBtn', el => el.onclick = openWordList);
  on('reviewBtn', el => el.onclick = openReview);
  on('mathMore', el => el.addEventListener('toggle', e => { mathOpen = e.target.open; }));
  on('diffMore', el => el.addEventListener('toggle', e => { diffOpen = e.target.open; }));
  on('updNow', el => el.onclick = e => { e.preventDefault(); checkUpdate(true); });
  on('photoPick', el => el.onclick = pickPhoto);
  on('photoDel', el => el.onclick = () => { try { localStorage.removeItem(AVATAR_KEY); } catch (e) {} applyTheme(); openParents(); });
  $('closeParents').onclick = () => { $('parents').classList.remove('on'); renderHome(); };
  $('parents').classList.add('on');
}

// long-press (1,2 s) to open — so Lara doesn't open it by accident
(() => {
  const g = $('gear'); let id = null;
  const startHold = e => { e.preventDefault(); g.classList.add('hold'); id = setTimeout(() => { g.classList.remove('hold'); openParents(); }, 1200); };
  const stopHold = () => { clearTimeout(id); g.classList.remove('hold'); };
  g.addEventListener('pointerdown', startHold);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => g.addEventListener(ev, stopHold));
  g.addEventListener('contextmenu', e => e.preventDefault());
})();

/* ---------- wiring ---------- */
$('startBtn').addEventListener('click', () => startSession('read'));
$('mathBtn').addEventListener('click', () => startSession('math'));
$('camBtn').addEventListener('click', pickPhoto);
$('againBtn').addEventListener('click', () => startSession(G ? G.mode : 'read'));
$('homeBtn').addEventListener('click', () => { clearTimers(); try { speechSynthesis.cancel(); } catch (e) {} renderHome(); });
$('hear').addEventListener('click', e => { e.stopPropagation(); if (G && G.target) speakWord(G.target); });
document.addEventListener('gesturestart', e => e.preventDefault());

// debug hook for testing
window.__lesespiel = { get G() { return G; }, get P() { return P; }, get M() { return M; } };

renderHome();
prefetchVoice();

// ---- atualização: ao abrir ou voltar para o app, confere se há versão nova ----
async function checkUpdate(manual) {
  if (!location.protocol.startsWith('http')) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    const v = (await r.json()).v;
    if (v > APP_VERSION) {
      const inGame = $('game').classList.contains('on');
      let last = 0; try { last = +sessionStorage.getItem('lesespiel-reload') || 0; } catch (e) {}
      if (!manual && Date.now() - last < 60000) return;           // trava contra loop
      if (manual || !inGame) {
        try { sessionStorage.setItem('lesespiel-reload', String(Date.now())); } catch (e) {}
        try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
        location.reload();
      }
    } else if (manual) alert('Você já está na versão mais nova (' + APP_VERSION + ').');
  } catch (e) { if (manual) alert('Sem internet agora. Tente de novo com Wi-Fi.'); }
}
checkUpdate(false);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(false); });

// offline: guarda o jogo no iPad depois da primeira abertura
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
